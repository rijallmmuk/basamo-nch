<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="Modul Pembelajaran Basamo NCH">
  <defs>
    <linearGradient id="module-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="cyan-accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
  </defs>
  
  {{-- Background --}}
  <rect width="800" height="600" fill="url(#module-bg)"/>
  
  {{-- Decorative Geometric Circles --}}
  <circle cx="680" cy="90" r="160" fill="#38bdf8" opacity="0.12"/>
  <circle cx="120" cy="520" r="130" fill="#ffffff" opacity="0.05"/>
  <rect x="600" y="400" width="250" height="250" rx="35" fill="#ffffff" opacity="0.03" transform="rotate(-15 600 400)"/>

  {{-- Top Badge / Module Pill --}}
  <rect x="280" y="70" width="240" height="36" rx="18" fill="url(#cyan-accent)"/>
  <text x="400" y="93" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" fill="#0f172a" letter-spacing="2">MODUL LITERASI</text>

  {{-- Central Icon (Open Book / Learning Module Motif) --}}
  <g transform="translate(325, 145) scale(6.25)" fill="#ffffff" opacity="0.95">
    <path d="M12 3v15.5l-4-2.5-4 2.5V3h8zm2 0v15.5l4-2.5 4 2.5V3h-8zm-3-1H3a1 1 0 0 0-1 1v17a1 1 0 0 0 1.55.83L8 18.25l4.45 2.58A1 1 0 0 0 14 20V3a1 1 0 0 0-1-1h-2z"/>
  </g>
  
  {{-- Text Branding --}}
  <text x="400" y="440" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="900" fill="#ffffff" letter-spacing="1">Basamo NCH</text>
  <text x="400" y="485" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="600" fill="#38bdf8" opacity="0.9" letter-spacing="0.5">Modul Pembelajaran Mandiri</text>
</svg>
