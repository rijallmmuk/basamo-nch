<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="Program Pembelajaran Basamo NCH">
  <defs>
    <linearGradient id="program-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="50%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="gold-accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
  </defs>
  
  {{-- Background --}}
  <rect width="800" height="600" fill="url(#program-bg)"/>
  
  {{-- Decorative Geometric Pattern --}}
  <circle cx="700" cy="100" r="180" fill="#f59e0b" opacity="0.12"/>
  <circle cx="100" cy="500" r="150" fill="#ffffff" opacity="0.05"/>
  <rect x="-50" y="-50" width="300" height="300" rx="40" fill="#ffffff" opacity="0.03" transform="rotate(25)"/>

  {{-- Top Badge / Pillar Pill --}}
  <rect x="290" y="70" width="220" height="36" rx="18" fill="url(#gold-accent)"/>
  <text x="400" y="93" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" fill="#064e3b" letter-spacing="2">PROGRAM NAGARI</text>
  
  {{-- Central Icon (Academic Program Badge / Crown / Ribbon) --}}
  <g transform="translate(320, 140) scale(6.666)" fill="#ffffff" opacity="0.95">
    <path d="M12 2L1 7l11 5 9-4.09V17h2V7L12 2zm0 8.75L4.5 7.5 12 4.1l7.5 3.4-7.5 3.25zM5 13.18v4L12 21l7-3.82v-4L12 17l-7-3.82z"/>
  </g>
  
  {{-- Text Branding --}}
  <text x="400" y="440" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="900" fill="#ffffff" letter-spacing="1">Basamo NCH</text>
  <text x="400" y="485" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="600" fill="#fcd34d" opacity="0.9" letter-spacing="0.5">Program Pembelajaran Nagari</text>
</svg>
