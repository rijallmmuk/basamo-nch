<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-label="Sampul Banner Etalase UMKM Basamo NCH">
  <defs>
    <linearGradient id="sampul-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="40%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="amber-accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="1920" height="1080" fill="url(#sampul-bg)"/>

  <!-- Decorative Overlays -->
  <circle cx="1600" cy="200" r="450" fill="#f59e0b" opacity="0.08"/>
  <circle cx="300" cy="900" r="380" fill="#ffffff" opacity="0.04"/>
  <rect x="1400" y="700" width="600" height="600" rx="80" fill="#ffffff" opacity="0.03" transform="rotate(-20 1400 700)"/>
  <rect x="-100" y="-100" width="500" height="500" rx="60" fill="#f59e0b" opacity="0.05" transform="rotate(15 -100 -100)"/>

  <!-- Top Category Pill Badge -->
  <rect x="760" y="180" width="400" height="60" rx="30" fill="url(#amber-accent)"/>
  <text x="960" y="218" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="900" fill="#064e3b" letter-spacing="3">ETALASE UMKM NAGARI</text>

  <!-- Central Icon (Storefront Landmark Motif) -->
  <g transform="translate(860, 320) scale(8)" fill="#ffffff" opacity="0.95">
    <path d="M20 4H4v2h16V4zm1 10v-2l-1-5H4l-1 5v2h1v6h10v-6h4v6h2v-6h1zm-9 6H6v-6h6v6z"/>
  </g>

  <!-- Main Headline -->
  <text x="960" y="650" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="76" font-weight="900" fill="#ffffff" letter-spacing="2">Basamo NCH</text>
  
  <!-- Subtitle -->
  <text x="960" y="730" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="600" fill="#f59e0b" opacity="0.9" letter-spacing="1">Pusat Produk &amp; Usaha Kreatif Lokal Nagari</text>
</svg>
